name: Build Y4K13 Downloader

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter yt-dlp Pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Y4K13_Ultimate_Downloader" --collect-all customtkinter --collect-all PIL app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Y4K13-Windows-Download
        path: dist/Y4K13_Ultimate_Downloader.exe