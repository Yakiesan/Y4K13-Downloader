name: Build Y4K13 Ultimate

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Pro Dependencies
      run: |
        pip install "yt-dlp[default,curl-cffi]" customtkinter Pillow pyinstaller
    - name: Compile Y4K13 EXE
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed `
        --add-data "miku_peak.png;." `
        --collect-all customtkinter `
        --name "Y4K13_Downloader" app.py
    - uses: actions/upload-artifact@v4
      with:
        name: Y4K13-Final-Product
        path: dist/Y4K13_Downloader.exe